name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build bundles
        run: node scripts/build.mjs
      - name: Syntax check
        run: npm run check
      - name: Verify package contents
        run: npm pack --dry-run
